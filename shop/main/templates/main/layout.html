{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Python Web Lab: Python, Django та Flask для знайомства з веброзробкою.">
    <title>{% block title %}Python Web Lab{% endblock %}</title>
    <link href="{% static 'main/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'main/css/site.css' %}" rel="stylesheet">
</head>
<body>
    <a class="visually-hidden-focusable" href="#content">До вмісту</a>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Головне меню">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'home' %}">Python Web Lab</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainMenu" aria-controls="mainMenu"
                    aria-expanded="false" aria-label="Відкрити меню">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'home' %} active{% endif %}"
                           href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'about' %} active{% endif %}"
                           href="{% url 'about' %}"{% if request.resolver_match.url_name == 'about' %} aria-current="page"{% endif %}>Про проєкт</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#technologies">Технології</a></li>
                    <li class="nav-item"><a class="nav-link" href="https://github.com/qqwwalls/python_test/tree/practice-django-shop">GitHub</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main id="content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer bg-dark text-white py-3">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>© {% now 'Y' %} Python Web Lab</span>
            <span class="footer-note">Навчання починається з цікавості</span>
        </div>
    </footer>
    <script src="{% static 'main/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
