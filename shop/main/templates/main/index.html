{% extends 'main/layout.html' %}
{% load static %}
{% block title %}
Main Page
{% endblock %}


{%block content%}
  <!-- Заголовок -->
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
            <h1 class="display-5 fw-bold">Вітаємо на нашому сайті!</h1>
            <p class="fs-5 text-muted">
                Це головна сторінка сайта
            </p>
            <button class="btn btn-primary">
                Детальніше
            </button>
        </div>
        <section class="card mb-4" style="max-width: 320px">
            <img src="{% static 'main/images/django.png' %}" class="card-img-top" alt="Django">
            <div class="card-body">
                <h4 class="card-title">Django</h4>
                <p class="card-text">Вебфреймворк на Python для створення сайтів і вебзастосунків.</p>
                <a href="https://www.djangoproject.com/" class="btn btn-primary">Перейти до Django</a>
            </div>
        </section>
{%endblock%}
