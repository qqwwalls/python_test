{% extends 'main/layout.html' %}
{% load static %}

{% block title %}Реєстрація — Python Web Lab{% endblock %}

{% block content %}
    <section class="container registration-section">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h1 class="registration-title" id="registration-title">Реєстрація</h1>
                <form id="registration-form" method="post" action="{% url 'registration' %}" aria-labelledby="registration-title">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        <div class="invalid-feedback" id="{{ field.id_for_label }}_error"></div>
                    </div>
                    {% endfor %}
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="show-password">
                        <label class="form-check-label" for="show-password">Показати пароль</label>
                    </div>
                    <button class="btn btn-primary registration-submit" type="submit">Надіслати</button>
                    <div class="registration-result mt-3" id="registration-result" role="status" aria-live="polite" hidden></div>
                </form>
            </div>
        </div>
    </section>
{% endblock %}

{% block scripts %}
    <script src="{% static 'main/js/registration.js' %}" defer></script>
{% endblock %}
