{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Персональне CV {{ profile.name }}: освіта, навички та навчальні проєкти.">
    <title>{% block title %}{{ profile.name }} — CV{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'main/css/cv.css' %}" rel="stylesheet">
</head>
<body>
    <a class="visually-hidden-focusable skip-link" href="#main-content">До резюме</a>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" aria-label="Навігація резюме">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">{{ profile.name }}<span class="brand-label">CV</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#cv-menu"
                    aria-controls="cv-menu" aria-expanded="false" aria-label="Відкрити меню">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="cv-menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#about">Про себе</a></li>
                    <li class="nav-item"><a class="nav-link" href="#education">Освіта</a></li>
                    <li class="nav-item"><a class="nav-link" href="#skills">Навички</a></li>
                    <li class="nav-item"><a class="nav-link" href="#projects">Проєкти</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacts">Контакти</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="page-footer">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>© {% now 'Y' %} {{ profile.name }}</span>
            <a href="#main-content">На початок</a>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'main/js/cv.js' %}"></script>
</body>
</html>
